services:
  app:
    build: .
    image: attack-logging-coverage:latest
    container_name: attack-logging-coverage
    ports:
      - "8000:8000"
    environment:
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      LCM_SECRET_KEY: ${LCM_SECRET_KEY:-}
      LCM_SYNC_INTERVAL_MINUTES: ${LCM_SYNC_INTERVAL_MINUTES:-60}
      LCM_SEED_DEMO: ${LCM_SEED_DEMO:-true}
    volumes:
      - lcm-data:/data
    restart: unless-stopped

volumes:
  lcm-data:
